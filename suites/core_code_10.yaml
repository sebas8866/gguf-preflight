id: core_code_10
kind: code
version: 1
description: Self-contained Python tasks verified by running hidden assertions.
timeout_s: 5
max_tokens: 420
warn_below: 0.8
fail_below: 0.6
system: >-
  You are a precise Python programmer. Reply with one fenced python code block containing
  only the requested code. Use the standard library only. Do not include tests, examples,
  prints, or explanation.
tasks:
  - id: code_01_two_sum
    prompt: >-
      Write `two_sum(nums, target)` that returns a tuple (i, j) of indices with i < j whose
      values add up to target, or None if no pair exists. Choose the pair with the smallest j,
      then the smallest i.
    tests: |
      assert two_sum([2, 7, 11, 15], 9) == (0, 1)
      assert two_sum([3, 2, 4], 6) == (1, 2)
      assert two_sum([3, 3], 6) == (0, 1)
      assert two_sum([1, 2, 3], 100) is None
      assert two_sum([-1, 4, 5, 1], 0) == (0, 3)

  - id: code_02_balanced
    prompt: >-
      Write `is_balanced(text)` that returns True when every (), [] and {} in text is correctly
      nested and closed. Ignore all other characters.
    tests: |
      assert is_balanced("") is True
      assert is_balanced("a(b[c]{d}e)f") is True
      assert is_balanced("(]") is False
      assert is_balanced("([)]") is False
      assert is_balanced("((") is False
      assert is_balanced("}") is False

  - id: code_03_roman
    prompt: >-
      Write `roman_to_int(s)` that converts a valid uppercase Roman numeral to an integer.
    tests: |
      assert roman_to_int("III") == 3
      assert roman_to_int("IV") == 4
      assert roman_to_int("IX") == 9
      assert roman_to_int("LVIII") == 58
      assert roman_to_int("MCMXCIV") == 1994

  - id: code_04_merge_intervals
    prompt: >-
      Write `merge_intervals(intervals)` that takes a list of [start, end] pairs in any order and
      returns a new sorted list of merged [start, end] pairs. Do not modify the input list.
      Touching intervals such as [1, 2] and [2, 3] must merge.
    tests: |
      assert merge_intervals([]) == []
      assert merge_intervals([[1, 3], [2, 6], [8, 10], [15, 18]]) == [[1, 6], [8, 10], [15, 18]]
      assert merge_intervals([[1, 2], [2, 3]]) == [[1, 3]]
      assert merge_intervals([[5, 6], [1, 10]]) == [[1, 10]]
      source = [[3, 4], [1, 2]]
      assert merge_intervals(source) == [[1, 2], [3, 4]]
      assert source == [[3, 4], [1, 2]]

  - id: code_05_flatten
    prompt: >-
      Write `flatten(items)` that returns a flat list from arbitrarily nested lists and tuples.
      Strings must stay whole and keep their order.
    tests: |
      assert flatten([]) == []
      assert flatten([1, [2, [3, (4, 5)]], 6]) == [1, 2, 3, 4, 5, 6]
      assert flatten(["ab", ["cd", ("ef",)]]) == ["ab", "cd", "ef"]
      assert flatten([[], [[]], ()]) == []

  - id: code_06_top_words
    prompt: >-
      Write `top_words(text, k)` that returns the k most frequent lowercase words as a list of
      (word, count) tuples. A word is a run of ASCII letters. Sort by count descending, then
      word ascending.
    tests: |
      assert top_words("the cat and the dog and the bird", 2) == [("the", 3), ("and", 2)]
      assert top_words("B a b A c", 3) == [("a", 2), ("b", 2), ("c", 1)]
      assert top_words("Hello, hello! World.", 1) == [("hello", 2)]
      assert top_words("", 3) == []

  - id: code_07_rle
    prompt: >-
      Write `rle_encode(s)` and `rle_decode(s)`. Encoding replaces each run with its length and
      character, for example "aaab" becomes "3a1b". Input contains no digits. Run lengths can
      have multiple digits.
    tests: |
      assert rle_encode("") == ""
      assert rle_encode("aaab") == "3a1b"
      assert rle_decode("3a1b") == "aaab"
      assert rle_encode("x" * 12) == "12x"
      assert rle_decode("12x1y") == "x" * 12 + "y"
      for value in ("abc", "zzzzzzzzzzzq", "  --"):
          assert rle_decode(rle_encode(value)) == value

  - id: code_08_lower_bound
    prompt: >-
      Write `first_index(nums, target)` using binary search. nums is sorted ascending and may
      contain duplicates. Return the index of the first occurrence of target, or -1.
    tests: |
      assert first_index([], 1) == -1
      assert first_index([1, 2, 2, 2, 3], 2) == 1
      assert first_index([1, 1, 1], 1) == 0
      assert first_index([1, 3, 5], 4) == -1
      assert first_index([1, 3, 5], 5) == 2
      assert first_index(list(range(100000)), 99999) == 99999

  - id: code_09_lru
    prompt: >-
      Write class `LRUCache` with `__init__(self, capacity)`, `get(self, key)` returning the value
      or -1, and `put(self, key, value)`. Both get and put make a key most recently used. When
      over capacity, evict the least recently used key.
    tests: |
      cache = LRUCache(2)
      cache.put(1, 1)
      cache.put(2, 2)
      assert cache.get(1) == 1
      cache.put(3, 3)
      assert cache.get(2) == -1
      cache.put(4, 4)
      assert cache.get(1) == -1
      assert cache.get(3) == 3
      assert cache.get(4) == 4
      cache.put(3, 30)
      cache.put(5, 5)
      assert cache.get(3) == 30
      assert cache.get(4) == -1

  - id: code_10_parse_query
    prompt: >-
      Write `parse_pairs(text)` that parses "a=1&b=two&a=3" into a dict mapping each key to a list
      of its values in order. Skip empty segments. A segment with no "=" has the value "". Split
      each segment on the first "=" only.
    tests: |
      assert parse_pairs("") == {}
      assert parse_pairs("a=1&b=two&a=3") == {"a": ["1", "3"], "b": ["two"]}
      assert parse_pairs("flag&&x=") == {"flag": [""], "x": [""]}
      assert parse_pairs("k=a=b") == {"k": ["a=b"]}
